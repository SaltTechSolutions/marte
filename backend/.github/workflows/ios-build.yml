name: GymEntra iOS CI/CD

on:
  push:
    branches: [ main, release ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build iOS Archive & IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -archivePath ios/App/App.xcarchive \
                     archive ALLOW_PROVISIONING_UPDATES=YES
        continue-on-error: true

      - name: Upload iOS Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymentra-ios-archive
          path: ios/App/App.xcarchive
