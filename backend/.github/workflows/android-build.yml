name: GymEntra Android CI/CD

on:
  push:
    branches: [ main, release ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Sign Android Release AAB
        id: sign_app
        uses: r2da/actions-android-signer@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        continue-on-error: true

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gymentra-android-release
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Deploy to Google Play Console (Internal Track)
        uses: rablix/action-google-play-developer-api@v1
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gymentra.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
