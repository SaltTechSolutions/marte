<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kukla Editörü — GymEntra</title>
<style>
  :root {
    --bg0:#0B0F19; --bg1:#111827; --surf:#161D2B; --surf2:#1D2536;
    --line:rgba(255,255,255,.10); --txt:#fff; --sub:#9CA3AF; --p:#10B981;
    --warn:#FBBF24; --danger:#F87171;
    --skin:#2B3546; --skinFar:#151C29; --joint:#323D50; --metal:#0D131D; --floor:#3A4553;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg0); color:var(--txt);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { display:grid; grid-template-columns:210px 1fr 300px; height:100vh; }
  .col { overflow-y:auto; padding:12px; }
  .col + .col { border-left:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 10px; letter-spacing:.02em; }
  h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); margin:14px 0 6px; }
  h2:first-child { margin-top:0; }
  .list button { display:block; width:100%; text-align:left; background:var(--surf); color:var(--txt);
                 border:1px solid var(--line); border-radius:8px; padding:7px 9px; margin-bottom:5px;
                 font:inherit; font-size:13px; cursor:pointer; }
  .list button[aria-pressed="true"] { border-color:var(--p); background:#12281f; }
  .list .bad { color:var(--danger); float:right; }
  .stage { background:var(--bg1); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  svg { display:block; width:100%; height:min(62vh,560px); touch-action:none; }
  .handle { cursor:grab; }
  .handle:active { cursor:grabbing; }
  .bar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:10px 0; }
  button, select, input[type=text] { font:inherit; font-size:13px; background:var(--surf); color:var(--txt);
           border:1px solid var(--line); border-radius:8px; padding:6px 11px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--p); color:#06281F; border-color:var(--p); }
  button.primary { background:var(--p); color:#06281F; border-color:var(--p); font-weight:700; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=range] { width:100%; accent-color:var(--p); }
  .row { display:grid; grid-template-columns:88px 1fr 52px; gap:8px; align-items:center; margin-bottom:5px; }
  .row label { font-size:12px; color:var(--sub); }
  .row output { font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .kf { display:flex; gap:6px; flex-wrap:wrap; }
  .kf button { padding:5px 9px; font-size:12px; }
  .issues { display:grid; gap:5px; font-size:12px; }
  .issues .i { border-left:3px solid var(--danger); background:#2a1414; padding:6px 8px; border-radius:0 6px 6px 0; }
  .ok { color:var(--p); font-size:12px; }
  .field { display:grid; grid-template-columns:96px 1fr; gap:8px; align-items:center; margin-bottom:6px; }
  .field span { font-size:12px; color:var(--sub); }
  .hint { font-size:11px; color:var(--sub); line-height:1.45; }
  .saved { color:var(--p); font-size:12px; }
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <h1>Kukla editörü</h1>
    <div class="list" id="exList"></div>
  </div>

  <div class="col">
    <div class="bar">
      <button id="viewSide" aria-pressed="true">Yan</button>
      <button id="viewFront" aria-pressed="false">Önden</button>
      <button id="play">Oynat</button>
      <span class="hint" id="frameInfo"></span>
      <span style="flex:1"></span>
      <button class="primary" id="save">Kaydet</button>
      <span class="saved" id="savedMsg"></span>
    </div>
    <div class="stage"><svg id="stage" preserveAspectRatio="xMidYMid meet"></svg></div>
    <h2>Kareler</h2>
    <div class="kf" id="kfList"></div>
    <div class="bar">
      <button id="addKf">+ Kare</button>
      <button id="delKf">Kareyi sil</button>
      <label class="hint">ad <input type="text" id="kfName" style="width:120px"></label>
      <label class="hint">an <input type="text" id="kfTime" style="width:56px"></label>
    </div>
    <p class="hint">Eklemi tut ve sürükle. Kemik boyu sabittir: eklem hedefe bakan yöne döner. Kalçayı sürüklemek iki kemiği birden çözer (çömelme derinliği).</p>
  </div>

  <div class="col">
    <h2>Denetim</h2>
    <div class="issues" id="issues"></div>

    <h2>Ekipman</h2>
    <div class="field"><span>Kök</span><select id="mode"></select></div>
    <div class="field"><span>Kol</span><select id="arm"></select></div>
    <div class="field"><span>Bar yeri</span><select id="barSel"></select></div>
    <div class="field"><span>Yük</span><select id="load"></select></div>
    <div class="field"><span>Sahne</span><select id="prop"></select></div>
    <div class="field"><span>Düzlem</span><select id="viewSel"></select></div>
    <div class="field"><span>Dirsek yönü</span><select id="bend"></select></div>
    <div class="field"><span>Süre (ms)</span><input type="text" id="dur"></div>

    <h2>Açılar</h2>
    <div id="sliders"></div>
  </div>
</div>
<script type="module" src="/editor.js"></script>
</body>
</html>
